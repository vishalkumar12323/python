[project]
name = "data-api"
version = "0.1.0"
description = "Data_api is a simple testing api project build with FastAPI!"
readme = "README.md"
authors = [
    { name = "Vishal Kumar", email = "vishalninaniya8949info@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
data-api = "data_api:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
